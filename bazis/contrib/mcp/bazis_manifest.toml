# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-mcp"
summary = "MCP server of a Bazis project: the catalog of the Bazis packages and the facts and checks of the project for AI agents"
solves = [
    "an AI agent chooses the Bazis packages a project needs and reads how to use them",
    "an AI agent finds the part of the guides of the Bazis packages that answers its question",
    "an AI agent reads the models, routes and settings of the project",
    "an AI agent checks the project after a change",
    "an AI agent checks the frontend specs, finds the stale parts of the frontend and chooses its components (bazis-front)",
    "an AI agent creates a Bazis project from the conversation, or chooses the existing one it changes",
    "an AI agent finds the programs a project needs on the machine and installs them once the user agrees",
    "an AI agent without a shell reads, writes and deletes the files of the project, runs its commands and servers and adds its Bazis packages",
]
requires = ["bazis"]
pairs_well = []

[[extension_points]]
name = "bazis-mcp"
import = "bazis.contrib.mcp.server.main"
use_when = "the command that MCP clients run in the project directory"

[[extension_points]]
name = "server"
import = "bazis.contrib.mcp.server.server"
use_when = "the MCPServer instance, to mount it in another server or test it in-process"

[[pitfalls]]
text = "the project tools run the management commands with .venv of the project (or --python); without one they use the Python of the server, which must then have the packages of the project, but pip (add_packages, run_command pip) is refused: it installs only into the Python of the project"

[[pitfalls]]
text = "the guides of packages that are not installed come from a snapshot taken at the release of bazis-mcp"

[[pitfalls]]
text = "install_tools runs only the commands of its table (Homebrew); the commands with sudo (apt) and a machine without a package manager are left to the user (run_yourself)"

[[pitfalls]]
text = "a server started outside a project serves none: the project tools answer No project, with the projects one level below its current directory, until create_project or use_project; the catalog tools describe the released packages only"

[[pitfalls]]
text = "run_command runs only the commands of its closed table, with plain arguments that stay in the project: a command of the caller, a character of a shell, .. or a path outside the project is refused, and so are options of the commands that remove a directory they are given (--basetemp of pytest; --output, --fsModuleCachePath, --coverage.reportsDirectory of the scripts of npm), as arguments (not in a configuration)"

[[pitfalls]]
text = "write_file never writes .env, .venv/, .git/, contract/ or a generated/ directory, and read_file never reads .env (these names in any case): they are written by the user, installed, committed or generated"

[[pitfalls]]
text = "delete_file deletes one file of the project, or a symbolic link itself: never a directory nor what write_file never writes; clean_project removes only its fixed list of temporary files and outputs of the builds and the tests"

[[pitfalls]]
text = "create_project creates the database only on a server chosen, that of the environment of the server or its database (host:port): without either it is refused, never a database on localhost:5432 of other projects"
