# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-mcp"
summary = "MCP server of a Bazis project: the catalog of the Bazis packages and the facts and checks of the project for AI agents"
solves = [
    "an AI agent chooses the Bazis packages a project needs and reads how to use them",
    "an AI agent finds the part of the guides of the Bazis packages that answers its question",
    "an AI agent reads the models, routes and settings of the project",
    "an AI agent checks the project after a change",
    "an AI agent checks the frontend specs, finds the stale parts of the frontend and chooses its components (bazis-front)",
    "an AI agent creates a Bazis project from the conversation, or chooses the existing one it changes",
    "an AI agent finds the programs a project needs on the machine and installs them once the user agrees",
    "an AI agent without a shell reads and writes the files of the project, runs its commands and servers and adds its Bazis packages",
]
requires = ["bazis"]
pairs_well = []

[[extension_points]]
name = "bazis-mcp"
import = "bazis.contrib.mcp.server.main"
use_when = "the command that MCP clients run in the project directory"

[[extension_points]]
name = "server"
import = "bazis.contrib.mcp.server.server"
use_when = "the MCPServer instance, to mount it in another server or test it in-process"

[[pitfalls]]
text = "the project tools run the management commands with .venv of the project (or --python); without one they use the Python of the server, which must then have the packages of the project"

[[pitfalls]]
text = "the guides of packages that are not installed come from a snapshot taken at the release of bazis-mcp"

[[pitfalls]]
text = "install_tools runs only the commands of its table (Homebrew); the commands with sudo (apt) and a machine without a package manager are left to the user (run_yourself)"

[[pitfalls]]
text = "a server started outside a project serves none: the tools answer No project until create_project or use_project"

[[pitfalls]]
text = "run_command runs only the commands of its closed table, with plain arguments that stay in the project: a command of the caller, a character of a shell, .. or a path outside the project is refused, and so are the options of manage --settings and --pythonpath and those of pytest that write the paths they name or change its configuration (--basetemp, --junitxml, -p, -c, -o...)"

[[pitfalls]]
text = "write_file never writes .env, .venv/, .git/, contract/ or a generated/ directory, and read_file never reads .env (these names in any case, and a hard link to .env): they are written by the user, installed, committed or generated"
